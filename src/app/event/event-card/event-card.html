<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{event().label}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-chip-set aria-label="Fish selection">
      <mat-chip class="flex-center">Début {{event().startDate | date:'dd/MM/yyy'}}</mat-chip>
      <mat-chip class="flex-center">
        Fin {{event().startDate | date:'dd/MM/yyy'}}</mat-chip>
    </mat-chip-set>
    <div>Nombre d'artistes: {{event().artists?.length}}</div>
    @if (event().artists && event().artists?.length!=0){
    } @else {
      <div class="list-artist-no-content">
        Aucun artiste associé à cet événement
      </div>
    }
  </mat-card-content>
  <mat-card-actions>
    <button routerLink="/events/{{event().id}}" matButton="outlined">
      <mat-icon>visibility</mat-icon>Détails
    </button>
  </mat-card-actions>
</mat-card>
