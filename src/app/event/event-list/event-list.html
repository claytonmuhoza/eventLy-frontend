<h2>
  List of events
</h2>
@if(events() && !error()){
  @if (!loading()){
    <section>
      @if(events()?.content?.length ==0){
        <div>
          No events yet
        </div>
      }@else{
        <mat-paginator [length]="100"
                       [pageSize]="10"
                       [pageSizeOptions]="[5, 10, 25, 100]"
                       aria-label="Select page">
        </mat-paginator>
        @for (event of events()?.content; track event.id)
        {
          <app-event-card [event]="event"/>
        }

      }
    </section>
  }@else{
    <div>
      Loading...
    </div>
  }
}
