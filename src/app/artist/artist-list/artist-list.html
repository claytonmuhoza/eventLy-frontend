@let artists = this.artists();
<h2>Liste des artistes</h2>
@if(artists){
  <section class="artist-list">
    @for (artist of artists.content; track artist.id){
      <app-artist-card [artist]="artist"/>
    }
  </section>
  <mat-paginator
    [length]="artists.totalElements"
    [pageIndex]="page()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="onPage($event)"
    aria-label="Sélection de page">
  </mat-paginator>
} @else {
  <section>An Error occur</section>
}
